# Namespace con Pod Security Admission (skill 10). Se aplica «restricted»:
# el pod de la plataforma cumple todos los controles de seguridad.
apiVersion: v1
kind: Namespace
metadata:
  name: seguimiento
  labels:
    app.kubernetes.io/part-of: plataforma-guia
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
