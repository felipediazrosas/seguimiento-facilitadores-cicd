# Actualizaciones automáticas de dependencias (skill 02): npm, imagen base y acciones
version: 2
updates:
  - package-ecosystem: npm
    directory: /plataforma-guia-implementacion
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /plataforma-guia-implementacion
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
