# Configuración del análisis SonarCloud (job «sonar» de .github/workflows/ci.yml).
# La organización y la clave del proyecto NO se fijan aquí: el CI las toma de las
# variables del repositorio SONAR_ORGANIZATION y SONAR_PROJECT_KEY, y el token del
# secreto SONAR_TOKEN (nunca se escribe en archivos versionados).
sonar.projectName=Guía de estandarización y seguimiento de facilitadores
sonar.sources=plataforma-guia-implementacion/server,plataforma-guia-implementacion/js
sonar.tests=plataforma-guia-implementacion/test
sonar.exclusions=**/node_modules/**,**/vendor/**,**/coverage/**
sonar.javascript.lcov.reportPaths=plataforma-guia-implementacion/coverage/lcov.info
sonar.sourceEncoding=UTF-8
